  <text x="69" y="255" fill="#bdc8d2" font-family="Arial, Helvetica, sans-serif" font-size="24">A memory-safe reverse proxy with a built-in MCP gateway.</text>
  <text x="70" y="321" fill="#7ba5ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2">XINPROXY.COM  /  DOCS  /  DOWNLOADS</text>
  <g transform="translate(854 31)">
