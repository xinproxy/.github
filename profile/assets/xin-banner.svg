<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Xinproxy</title>
  <desc id="desc">Xinproxy: the edge for your apps and AI tools, with the Xin X mark.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#364453" stroke-width="1" opacity=".45"/>
    </pattern>
    <linearGradient id="ground" x2="1" y2="1">
      <stop stop-color="#10151c"/>
      <stop offset="1" stop-color="#1c304b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" rx="22" fill="url(#ground)"/>
